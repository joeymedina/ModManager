name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore ModManager.slnx

      - run: dotnet build ModManager.slnx --no-restore --configuration Release

      - run: dotnet test ModManager.slnx --no-build --configuration Release
